<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>20種結果留言牆</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  /* === 自訂鼠標樣式 === */
  body, button, input, .person, .zone, .ui-layer { 
    cursor: none !important; 
  }

  #fake-cursor {
    width: 100px; 
    height: 100px;
    position: fixed; top: 0; left: 0; 
    pointer-events: none; z-index: 99999; will-change: transform;
  }
  
  #fake-cursor-img {
    width: 100%; height: 100%;
    background-image: url('PNG/cursor.png'); 
    background-size: contain; background-repeat: no-repeat;
    transform-origin: center 80%;
  }
  
  #fake-cursor.is-clicking #fake-cursor-img {
    background-image: url('PNG/cursor-click.png'); 
    transform: rotate(-5deg);
  }

  * { box-sizing: border-box; }
  body { 
    font-family: "Manrope", "Noto Sans TC", sans-serif; 
    margin: 0; padding: 0; 
    background: #f0f0f0; 
    height: 100vh; width: 100vw;
    overflow: hidden; 
  }

  /* === 主容器 === */
  .viewport {
    width: 100%; height: 100%;
    position: relative;
    background-color: #fdfbf7;
    background-image: radial-gradient(#ddd 1px, transparent 1px);
    background-size: 30px 30px;
    display: flex; justify-content: center; align-items: center; 
    padding-bottom: 0px; /* 原本有預留輸入框高度，現在歸零 */
  }

  /* === 廣場網格 === */
  .plaza {
    width: 95vw; height: 90vh; 
    display: grid; 
    grid-template-columns: repeat(5, 1fr); 
    grid-template-rows: repeat(4, 1fr);
    gap: 12px; 
  }

  /* === 區域樣式 === */
  .zone {
    position: relative;
    border: 1px dashed rgba(0,0,0,0.15); 
    border-radius: 12px;
    background: rgba(255,255,255,0.4);
    transition: all 0.2s;
  }
  .zone:hover { 
    background: rgba(255,255,255,0.8); 
    border-color: rgba(0,0,0,0.3);
  }
  
  /* 🎯 修改：加深文字顏色與透明度，稍微放大字體 */
  .zone-label {
    position: absolute; 
    font-size: 24px; font-weight: 900; 
    color: #333; opacity: 0.5; /* 變明顯了 */
    bottom: 8px; right: 10px;
    pointer-events: none; z-index: 200; 
  }

  /* === 小人樣式 === */
  .person {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    width: 45px; /* 縮小後的尺寸 */
    z-index: 10;
    transform: translate(-50%, -50%) scale(1);
    transition: transform 0.2s, z-index 0.2s;
    cursor: pointer;
  }
  .person:hover { z-index: 100 !important; transform: translate(-50%, -50%) scale(1.3); }

  .avatar-video-box {
    width: 45px; height: 45px; 
    background: transparent; 
    border: none; 
    border-radius: 0; 
    box-shadow: none; 
    display: flex; justify-content: center; align-items: center;
    position: relative;
    overflow: visible; 
  }
  
  .avatar-video-box video {
    width: 100%; height: 100%;
    object-fit: contain; 
    transform: scale(1.1); 
  }

  .bubble {
    background: #fff; padding: 3px 6px; border-radius: 6px;
    font-size: 11px; font-weight: 700; color: #333;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    margin-bottom: 2px; 
    position: relative;
    max-width: 90px; 
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0.95;
    text-align: center;
  }
  .person:hover .bubble { white-space: normal; overflow: visible; z-index: 101; min-width: 70px;}
  .bubble::after {
    content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    border-width: 4px 4px 0; border-style: solid; border-color: #fff transparent transparent;
  }

  /* === 新增：原地輸入框樣式 === */
  .inline-input-wrapper {
    position: absolute;
    transform: translate(-50%, -100%);
    background: rgba(255, 255, 255, 0.95);
    padding: 8px 15px;
    border-radius: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    z-index: 1000;
    display: flex;
    align-items: center;
    border: 2px solid #333333;
  }
  .inline-input-wrapper::after {
    content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    border-width: 8px 8px 0; border-style: solid; border-color: #333333 transparent transparent;
  }
  .inline-input-wrapper input {
    border: none; outline: none; background: transparent;
    font-size: 16px; font-weight: bold; color: #333;
    width: 150px; text-align: center;
    cursor: none; 
  }

  /* === 新增：全域錯誤提示 === */
  .toast-message {
    position: fixed; top: 30px; left: 50%; transform: translate(-50%, -20px);
    background: #FF3B30; color: white;
    padding: 15px 30px; border-radius: 30px;
    font-weight: 900; font-size: 18px;
    z-index: 9999; pointer-events: none;
    opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  .toast-message.show {
    opacity: 1; transform: translate(-50%, 0);
  }

  /* === 浮動首頁按鈕 === */
  .ui-layer {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 500;
  }
  .floating-home {
    position: fixed; bottom: 30px; left: 30px;
    width: 60px; height: 60px; border-radius: 50%;
    background: #fff; border: 3px solid #eee;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; pointer-events: auto; z-index: 1000;
  }
</style>
</head>
<body>

<div id="fake-cursor"><div id="fake-cursor-img"></div></div>

<div class="viewport">
  <div class="plaza" id="plaza"></div>
</div>

<div class="ui-layer">
  <button class="floating-home" onclick="window.location.href='index.html'">
    <img src="PNG/回到最頂部_箭頭.png" alt="Home" style="width: 30px; transform: rotate(-90deg);">
  </button>
</div>

<script>
  // ==========================================
  // 1. 設定：20 種結果名稱 (對應格子)
  // ==========================================
  const roleList = [
    "淘氣", "幽默", "活潑", "大方",
    "害羞", "冷靜", "文靜", "沉穩",
    "溫柔", "善良", "耐心", "樂觀",
    "勇敢", "自信", "果斷", "獨立",
    "敏銳", "細心", "聰明", "謹慎"
  ];

  // 生成格子
  const plaza = document.getElementById('plaza');
  roleList.forEach((role, i) => {
    const zone = document.createElement('div');
    zone.className = 'zone';
    zone.id = `zone-${i}`;
    
    const label = document.createElement('div');
    label.className = 'zone-label';
    label.textContent = role;
    zone.appendChild(label);
    plaza.appendChild(zone);
  });

  // ==========================================
  // 2. 資料與狀態初始化
  // ==========================================
  const myData = JSON.parse(localStorage.getItem('photobooth_template') || '{}');
  const myRole = myData.role || '淘氣女'; // 如果沒有測試結果，預設為淘氣女
  
  const myAdjective = myRole.replace(/[男女]$/, '');
  let myRoleIndex = roleList.indexOf(myAdjective);
  if(myRoleIndex === -1) myRoleIndex = roleList.indexOf(myRole);
  if(myRoleIndex === -1) myRoleIndex = 19;
  const myZoneId = `zone-${myRoleIndex}`;

  let messages = JSON.parse(localStorage.getItem('guestbook_messages') || '[]');

  // 🎯 修改：一開始就出現大家的小人 (預設資料)
  if (messages.length === 0) {
      messages = [
          { role: "幽默男", text: "哈囉大家好！", time: "10:00", x: 20, y: 30 },
          { role: "活潑女", text: "好好玩喔", time: "10:05", x: 70, y: 40 },
          { role: "自信女", text: "我也要留言", time: "10:10", x: 50, y: 60 },
          { role: "溫柔男", text: "嗨～", time: "10:15", x: 30, y: 20 },
          { role: "聰明女", text: "這個設計不錯", time: "10:20", x: 80, y: 50 }
      ];
      localStorage.setItem('guestbook_messages', JSON.stringify(messages));
  }

  let isDragging = false;
  let draggedPerson = null;
  let dragMsgIdx = -1;

  // ==========================================
  // 3. 渲染小人畫面
  // ==========================================
  function renderCrowd() {
    // 重置所有格子的內容 (只保留標籤)
    document.querySelectorAll('.zone').forEach(z => {
      const label = z.querySelector('.zone-label');
      z.innerHTML = ''; 
      if(label) z.appendChild(label);
    });

    messages.forEach((msg, idx) => {
      const fullRole = msg.role;
      const adjective = fullRole.replace(/[男女]$/, '');
      
      let roleIndex = roleList.indexOf(adjective);
      if(roleIndex === -1) roleIndex = roleList.indexOf(fullRole);
      if(roleIndex === -1) roleIndex = 19; 

      const container = document.getElementById(`zone-${roleIndex}`);
      if(!container) return;

      const person = document.createElement('div');
      person.className = `person`;
      person.style.left = `${msg.x}%`;
      person.style.top = `${msg.y}%`;
      person.style.zIndex = idx + 10;

      const videoSrc = `Quiz results page/${fullRole}.webm`;

      person.innerHTML = `
        <div class="bubble">${msg.text}</div>
        <div class="avatar-video-box">
          <video src="${videoSrc}" loop muted playsinline preload="metadata"></video>
        </div>
      `;
      
      // 懸停播放影片
      person.addEventListener('mouseenter', () => {
        if (isDragging) return;
        const vid = person.querySelector('video');
        if (vid) vid.play().catch(e => console.log(e));
      });
      person.addEventListener('mouseleave', () => {
        if (isDragging) return;
        const vid = person.querySelector('video');
        if (vid) { vid.pause(); vid.currentTime = 0; }
      });

      // 拖曳功能
      person.addEventListener('mousedown', (e) => {
        isDragging = true;
        draggedPerson = person;
        dragMsgIdx = idx;
        person.style.transition = 'none'; 
        e.stopPropagation(); 
      });

      container.appendChild(person);
    });
  }

  // ==========================================
  // 4. 拖曳小人邏輯
  // ==========================================
  document.addEventListener('mousemove', (e) => {
      if (isDragging && draggedPerson) {
         const zone = draggedPerson.parentElement;
         const rect = zone.getBoundingClientRect();
         let x = ((e.clientX - rect.left) / rect.width) * 100;
         let y = ((e.clientY - rect.top) / rect.height) * 100;

         x = Math.max(5, Math.min(95, x));
         y = Math.max(5, Math.min(75, y)); // 避免擋住個性文字

         draggedPerson.style.left = `${x}%`;
         draggedPerson.style.top = `${y}%`;
         draggedPerson.dataset.x = x;
         draggedPerson.dataset.y = y;
      }
  });

  document.addEventListener('mouseup', () => {
      if (isDragging && draggedPerson) {
          draggedPerson.style.transition = '';
          if (dragMsgIdx !== -1 && draggedPerson.dataset.x) {
              messages[dragMsgIdx].x = parseFloat(draggedPerson.dataset.x);
              messages[dragMsgIdx].y = parseFloat(draggedPerson.dataset.y);
              localStorage.setItem('guestbook_messages', JSON.stringify(messages));
          }
          isDragging = false;
          draggedPerson = null;
          dragMsgIdx = -1;
      }
  });

  // ==========================================
  // 5. 點擊彈出輸入框邏輯
  // ==========================================
  let activeInputWrapper = null;

  plaza.addEventListener('mousedown', (e) => {
      if(e.target.closest('.person') || e.target.closest('.inline-input-wrapper')) return;
      
      const zone = e.target.closest('.zone');
      if(!zone) return;

      if(zone.id !== myZoneId) {
          showToast(`你只能在你的專屬區域 (${myAdjective}) 留言喔！`);
          return;
      }

      const rect = zone.getBoundingClientRect();
      let x = ((e.clientX - rect.left) / rect.width) * 100;
      let y = ((e.clientY - rect.top) / rect.height) * 100;

      x = Math.max(5, Math.min(95, x));
      y = Math.max(5, Math.min(75, y));

      if (activeInputWrapper) activeInputWrapper.remove();

      activeInputWrapper = document.createElement('div');
      activeInputWrapper.className = 'inline-input-wrapper';
      activeInputWrapper.style.left = `${x}%`;
      activeInputWrapper.style.top = `${y}%`;

      const inputEl = document.createElement('input');
      inputEl.type = 'text';
      inputEl.placeholder = '打字留言...';
      inputEl.maxLength = 15;

      activeInputWrapper.appendChild(inputEl);
      zone.appendChild(activeInputWrapper);

      activeInputWrapper.addEventListener('mousedown', (ev) => ev.stopPropagation());
      setTimeout(() => inputEl.focus(), 10);

      inputEl.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') {
              const text = inputEl.value.trim();
              if (text) saveMessage(text, x, y);
              activeInputWrapper.remove();
              activeInputWrapper = null;
          } else if (ev.key === 'Escape') {
              activeInputWrapper.remove();
              activeInputWrapper = null;
          }
      });
  });

  function saveMessage(text, x, y) {
      const newMsg = {
          role: myRole, 
          text: text,
          time: new Date().toLocaleTimeString(),
          x: x, 
          y: y
      };
      messages.push(newMsg); 
      localStorage.setItem('guestbook_messages', JSON.stringify(messages));
      renderCrowd();
  }

  function showToast(msg) {
      let toast = document.getElementById('toast');
      if(!toast) {
          toast = document.createElement('div');
          toast.id = 'toast';
          toast.className = 'toast-message';
          document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // 啟動渲染
  renderCrowd();

  // ==========================================
  // 6. 自訂鼠標動畫 (修復完成)
  // ==========================================
  (function(){
    const cursor = document.getElementById('fake-cursor');
    if (!cursor) return;
    
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2; 
    let curX = mouseX, curY = mouseY;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.addEventListener('mousedown', () => cursor.classList.add('is-clicking'));
    document.addEventListener('mouseup', () => cursor.classList.remove('is-clicking'));

    function renderCursor() {
      curX += (mouseX - curX) * 0.2;
      curY += (mouseY - curY) * 0.2;
      cursor.style.transform = `translate3d(${curX}px, ${curY}px, 0)`;
      requestAnimationFrame(renderCursor);
    }
    renderCursor();
  })();
</script>
</body>
</html>
