<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖標教學</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body class="teach-page-split">

    <div class="teach-split-container">
        
        <div class="teach-left-panel">
            
            <div class="teach-video-wrapper">
                <video id="video-icon" class="demo-layer" src="teach/樓梯_步驟1_圖標.webm" autoplay loop muted playsinline></video>
                <video id="video-hand" class="demo-layer" src="teach/樓梯_步驟1_手勢.webm" autoplay loop muted playsinline></video>
                <video id="video-both" class="demo-layer" src="teach/樓梯_步驟1.webm" autoplay loop muted playsinline></video>
            </div>

            <div class="teach-mid-controls">
                <button id="toggle-icon-btn" class="toggle-media-btn">
                    <img id="icon-btn-img" src="PNG/圖標按鈕_藍.png" alt="圖標切換">
                </button>
                <button id="toggle-hand-btn" class="toggle-media-btn">
                    <img id="hand-btn-img" src="PNG/手勢按鈕_藍.png" alt="手勢切換">
                </button>
            </div>

            <div class="teach-bottom-wrapper">
                <img src="teach/樓梯_圖標說明.png" alt="樓梯說明" class="teach-desc-img">
            </div>

        </div>

        <div class="teach-right-panel">
            
            <video id="user-webcam" autoplay playsinline muted></video>
            
            <div class="teach-overlay-ui">
                
                <div id="webcam-dim-overlay" class="webcam-dim-overlay">
                    <p>請將手放到畫面中</p>
                </div>

                <div class="overlay-top-left">
                    <button id="icon-menu-btn" class="icon-circle-btn">
                        <img src="PNG/放大鏡.png" alt="menu" style="width: 25px;">
                    </button>
                </div>
                
                <div id="icon-select-modal" class="teach-icon-modal">
                    
                    <div class="drag-overlay" id="modal-drag-overlay">
                        <div class="swing-dot"></div>
                        <p>可以左右拖曳</p>
                    </div>

                    <div class="modal-scroll-container">
                        
                        <div class="category-group">
                            <div class="category-title">空間導向</div>
                            <div class="category-icons">
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/樓梯.png" alt="樓梯"></div><div class="icon-name">樓梯</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/手扶梯.png" alt="手扶梯"></div><div class="icon-name">手扶梯</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/電梯.png" alt="電梯"></div><div class="icon-name">電梯</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/無線網路.png" alt="無線網路"></div><div class="icon-name">無線網路</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/公共電話.png" alt="公共電話"></div><div class="icon-name">公共電話</div></div>
                            </div>
                        </div>

                        <div class="category-group">
                            <div class="category-title">服務互動</div>
                            <div class="category-icons">
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/滅火器.png" alt="滅火器"></div><div class="icon-name">滅火器</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/資源回收.png" alt="資源回收"></div><div class="icon-name">資源回收</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/一般垃圾.png" alt="一般垃圾"></div><div class="icon-name">一般垃圾</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/置物櫃.png" alt="置物櫃"></div><div class="icon-name">置物櫃</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/茶水間.png" alt="茶水間"></div><div class="icon-name">茶水間</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/哺(集)乳室.png" alt="哺(集)乳室"></div><div class="icon-name">哺(集)乳室</div></div>
                            </div>
                        </div>

                        <div class="category-group">
                            <div class="category-title">公共場所</div>
                            <div class="category-icons">
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/廁所.png" alt="廁所"></div><div class="icon-name">廁所</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/男廁.png" alt="男廁"></div><div class="icon-name">男廁</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/女廁.png" alt="女廁"></div><div class="icon-name">女廁</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/公園.png" alt="公園"></div><div class="icon-name">公園</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/圖書館.png" alt="圖書館"></div><div class="icon-name">圖書館</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/學校.png" alt="學校"></div><div class="icon-name">學校</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/體育館.png" alt="體育館"></div><div class="icon-name">體育館</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/餐廳.png" alt="餐廳"></div><div class="icon-name">餐廳</div></div>
                            </div>
                        </div>

                        <div class="category-group">
                            <div class="category-title">交通設施</div>
                            <div class="category-icons">
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/公車站.png" alt="公車站"></div><div class="icon-name">公車站</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/月台.png" alt="月台"></div><div class="icon-name">月台</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/捷運.png" alt="捷運"></div><div class="icon-name">捷運</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/高鐵.png" alt="高鐵"></div><div class="icon-name">高鐵</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/機場.png" alt="機場"></div><div class="icon-name">機場</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/海關.png" alt="海關"></div><div class="icon-name">海關</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/加油站.png" alt="加油站"></div><div class="icon-name">加油站</div></div>
                            </div>
                        </div>

                        <div class="category-group">
                            <div class="category-title">行為規範</div>
                            <div class="category-icons">
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/禁止觸摸.png" alt="禁止觸摸"></div><div class="icon-name">禁止觸摸</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/禁止飲食.png" alt="禁止飲食"></div><div class="icon-name">禁止飲食</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/禁止拍攝.png" alt="禁止拍攝"></div><div class="icon-name">禁止拍攝</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/禁止交談.png" alt="禁止交談"></div><div class="icon-name">禁止交談</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/禁止吸菸.png" alt="禁止吸菸"></div><div class="icon-name">禁止吸菸</div></div>
                                <div class="icon-item"><div class="icon-box"><img src="Icon overview/禁止進入.png" alt="禁止進入"></div><div class="icon-name">禁止進入</div></div>
                            </div>
                        </div>

                    </div>
                </div> 
                
                <div class="overlay-top-center">
                    <h2 class="overlay-title" id="teach-title">樓梯</h2>
                    <div class="overlay-dots" id="teach-step-dots">
                        </div>
                </div>

                <div class="overlay-bottom-center">
                    <div class="accuracy-bar-container">
                        <div class="accuracy-text" id="accuracy-text">0%</div>
                        <div class="accuracy-bar-fill" id="accuracy-bar"></div>
                    </div>
                    
                    <div class="instruction-pill" id="teach-instruction">等待開始...</div>
                    
                    <button class="end-call-btn" >
                        <div style="width: 25px; height: 5px; background: white; border-radius: 5px;"></div>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="teach.js"></script>
</body>
</html>
