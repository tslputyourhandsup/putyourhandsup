<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>🖐️ 萬用手勢掃描機 (自動倒數版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; display: flex; background: #1a1a1a; color: #00EAFF; font-family: monospace; font-size: 14px; }
        #video-container { position: relative; width: 55vw; height: 100vh; background: #000; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* 倒數計時超大數字遮罩 */
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            font-size: 20rem;
            font-weight: 900;
            color: rgba(0, 234, 255, 0.9);
            text-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 100;
            pointer-events: none;
        }

        #debug-panel { width: 45vw; height: 100vh; padding: 20px; overflow-y: auto; background: #222; box-sizing: border-box; }
        h2 { border-bottom: 2px solid #00EAFF; padding-bottom: 10px; margin-top: 0; }
        .data-block { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; color: #FFF; line-height: 1.6; font-size: 1.1em;}
        .highlight { color: #FFAA00; font-weight: bold; }
        .status-paused { color: #FF3B30; font-size: 1.5em; font-weight: bold; animation: blink 1s infinite; display: block; margin-bottom: 10px;}
        @keyframes blink { 50% { opacity: 0.5; } }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button { background: #00EAFF; border: none; padding: 10px 20px; font-size: 1.2em; font-weight: bold; cursor: pointer; border-radius: 5px; color: #111;}
        button:hover { background: #00B4FF; }
        #countdown-btn { background: #FFAA00; }
        #countdown-btn:hover { background: #FF8800; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output-canvas"></canvas>
        <div id="countdown-overlay">3</div>
    </div>

    <div id="debug-panel">
        <h2>🖐️ 手勢數值掃描機 (雙手救星版)</h2>
        <div class="btn-group">
            <button id="pause-btn">⏸️ 暫停 / 恢復</button>
            <button id="countdown-btn">⏱️ 倒數 3 秒暫停</button>
        </div>
        <div id="pause-status"></div>
        <div id="log-output">等待鏡頭開啟...</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const logOutput = document.getElementById('log-output');
        const pauseStatus = document.getElementById('pause-status');
        const pauseBtn = document.getElementById('pause-btn');
        const countdownBtn = document.getElementById('countdown-btn');
        const countdownOverlay = document.getElementById('countdown-overlay');

        let isPaused = false;
        let lastResults = null;
        let isCountingDown = false;

        // 一般暫停切換
        function togglePause() {
            if (isCountingDown) return; // 倒數中不給按
            isPaused = !isPaused;
            pauseStatus.innerHTML = isPaused ? '<span class="status-paused">⏸️ 畫面已凍結，請截圖或複製下方數值！</span>' : '';
            if (isPaused && lastResults) renderData(lastResults);
        }

        // 倒數計時功能
        function startCountdown() {
            if (isCountingDown) return;
            
            // 如果目前是暫停狀態，先解除暫停
            if (isPaused) {
                isPaused = false;
                pauseStatus.innerHTML = '';
            }

            isCountingDown = true;
            let count = 3;
            countdownOverlay.innerText = count;
            countdownOverlay.style.display = 'flex';

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownOverlay.innerText = count;
                } else {
                    clearInterval(timer);
                    countdownOverlay.style.display = 'none';
                    isCountingDown = false;
                    togglePause(); // 時間到！觸發凍結
                }
            }, 1000);
        }

        pauseBtn.addEventListener('click', togglePause);
        countdownBtn.addEventListener('click', startCountdown);
        document.addEventListener('keydown', (e) => { 
            if (e.code === 'Space') { e.preventDefault(); togglePause(); } 
        });

        function getDist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

        function renderData(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            let logHTML = "";

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#FFFFFF', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#00EAFF', lineWidth: 2, radius: 4});
                }

                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const wrist = landmarks[0];
                    const handSize = getDist(wrist, landmarks[9]);
                    
                    const thumbRatio = getDist(wrist, landmarks[4]) / getDist(wrist, landmarks[2]);
                    const indexRatio = getDist(wrist, landmarks[8]) / getDist(wrist, landmarks[5]);
                    const middleRatio = getDist(wrist, landmarks[12]) / getDist(wrist, landmarks[9]);
                    const ringRatio = getDist(wrist, landmarks[16]) / getDist(wrist, landmarks[13]);
                    const pinkyRatio = getDist(wrist, landmarks[20]) / getDist(wrist, landmarks[17]);

                    const thumbToMiddleMid = getDist(landmarks[4], landmarks[10]) / handSize; 

                    logHTML += `<div class="data-block">`;
                    logHTML += `<h3>✋ 手部 ${index + 1} (大小基準值: ${(handSize).toFixed(3)})</h3>`;
                    
                    logHTML += `<strong>📍 基礎座標：</strong><br>`;
                    logHTML += `掌心 Y 座標 (高度): <span class="highlight">${landmarks[9].y.toFixed(3)}</span><br>`;
                    logHTML += `掌心 X 座標 (左右): <span class="highlight">${landmarks[9].x.toFixed(3)}</span><br><br>`;

                    logHTML += `<strong>📏 手指伸展比例 (大於 1.2 通常是伸直)：</strong><br>`;
                    logHTML += `大拇指: <span class="highlight">${thumbRatio.toFixed(2)}</span><br>`;
                    logHTML += `食指: <span class="highlight">${indexRatio.toFixed(2)}</span><br>`;
                    logHTML += `中指: <span class="highlight">${middleRatio.toFixed(2)}</span><br>`;
                    logHTML += `無名指: <span class="highlight">${ringRatio.toFixed(2)}</span><br>`;
                    logHTML += `小拇指: <span class="highlight">${pinkyRatio.toFixed(2)}</span><br><br>`;

                    logHTML += `<strong>🎯 關鍵距離 (相對於手部大小)：</strong><br>`;
                    logHTML += `拇指尖 到 中指第二關節 (判定捏合): <span class="highlight">${thumbToMiddleMid.toFixed(3)}</span><br>`;
                    logHTML += `</div>`;
                });

                if (results.multiHandLandmarks.length === 2) {
                    const distHands = getDist(results.multiHandLandmarks[0][9], results.multiHandLandmarks[1][9]);
                    logHTML += `<div class="data-block" style="background:#003344;">`;
                    logHTML += `<strong>🤝 雙手掌心距離：</strong> <span class="highlight">${distHands.toFixed(3)}</span>`;
                    logHTML += `</div>`;
                }

            } else {
                logHTML = "請將手放到鏡頭前...";
            }
            
            logOutput.innerHTML = logHTML;
            canvasCtx.restore();
        }

        function onResults(results) {
            if (!isPaused) {
                lastResults = results; 
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                renderData(results);
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);
        const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 1280, height: 720 });
        camera.start();
    </script>
</body>
</html>
